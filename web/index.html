<!DOCTYPE html>
<html>
<head>
  <!--
    Base path placeholder, replaced by `flutter build web --base-href`.
    Netlify: build without --base-href (uses "/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Phones: no zoom, use the full screen including the notch area -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Rocky Run: help Rocky the red toy poodle dodge the rocks. Created by Jovita.">
  <meta name="theme-color" content="#3A1C14">

  <!-- iOS: "Add to Home Screen" opens full screen like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rocky Run">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rocky Run</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* A game page must never scroll, bounce, zoom or select text on touch. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;          /* no pull-to-refresh / bounce */
      touch-action: none;                 /* no double-tap zoom, no tap delay */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;        /* no long-press menu / magnifier */
      -webkit-tap-highlight-color: transparent;
      background: #3A1C14;
    }
    body {
      position: fixed;                    /* iOS Safari: stops page scrolling */
      inset: 0;
    }
  </style>
  <script>
    // iOS Safari ignores user-scalable=no, so block its zoom gestures directly.
    (function () {
      var stop = function (e) { e.preventDefault(); };
      var opts = { passive: false };
      document.addEventListener('gesturestart', stop, opts);   // pinch zoom
      document.addEventListener('gesturechange', stop, opts);
      document.addEventListener('gestureend', stop, opts);
      document.addEventListener('dblclick', stop, opts);       // double-tap zoom
      document.addEventListener('touchmove', stop, opts);      // page bounce / scroll
      document.addEventListener('contextmenu', stop);          // long-press menu
    })();
  </script>
  <script>
    // Rocky Run sound effects via the Web Audio API: each sound is decoded
    // once into memory and starts instantly. (HTML <audio> takes ~0.2 s to
    // start on iPhone Safari, which froze the game on every jump / bone.)
    window.rrSfx = (function () {
      var ctx = null, buffers = {};
      function context() {
        if (!ctx) {
          var C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          ctx = new C();
        }
        return ctx;
      }
      function unlock() {
        var c = context();
        if (!c) return;
        if (c.state !== 'running') c.resume();
        // iOS needs one sound started inside a tap to enable audio.
        var s = c.createBufferSource();
        s.buffer = c.createBuffer(1, 1, 22050);
        s.connect(c.destination);
        s.start(0);
      }
      ['touchend', 'pointerdown', 'keydown'].forEach(function (ev) {
        document.addEventListener(ev, unlock, { passive: true });
      });
      function load(list) {
        var c = context();
        if (!c) return;
        list.split(',').forEach(function (name) {
          if (buffers[name]) return;
          fetch('assets/assets/audio/' + name + '.wav')
            .then(function (r) { return r.arrayBuffer(); })
            .then(function (data) {
              return new Promise(function (ok, fail) { c.decodeAudioData(data, ok, fail); });
            })
            .then(function (buf) { buffers[name] = buf; })
            .catch(function () {});
        });
      }
      function play(name, volume) {
        var c = context();
        if (!c || !buffers[name]) return false;
        if (c.state !== 'running') c.resume();
        var src = c.createBufferSource();
        src.buffer = buffers[name];
        var gain = c.createGain();
        gain.gain.value = volume;
        src.connect(gain);
        gain.connect(c.destination);
        src.start(0);
        return true;
      }
      // Tab hidden / app minimised: silence sound effects and tell the game
      // (it pauses the run and the music).
      function visibility() {
        var hidden = document.visibilityState === 'hidden';
        if (ctx) { hidden ? ctx.suspend() : null; }
        if (typeof window.rrOnVisibility === 'function') window.rrOnVisibility(hidden);
      }
      document.addEventListener('visibilitychange', visibility);
      window.addEventListener('pagehide', function () {
        if (typeof window.rrOnVisibility === 'function') window.rrOnVisibility(true);
        if (ctx) ctx.suspend();
      });
      return { load: load, play: play };
    })();
    window.rrOnVisibility = null; // set by the game (lib/web_sfx_web.dart)
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
