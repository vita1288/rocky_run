<!DOCTYPE html>
<html>
<head>
  <!--
    Base path placeholder, replaced by `flutter build web --base-href`.
    Netlify: build without --base-href (uses "/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Phones: no zoom, use the full screen including the notch area -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Rocky Run: help Rocky the red toy poodle dodge the rocks. Created by Jovita.">
  <meta name="theme-color" content="#3A1C14">

  <!-- iOS: "Add to Home Screen" opens full screen like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rocky Run">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rocky Run</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* A game page must never scroll, bounce, zoom or select text on touch. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;          /* no pull-to-refresh / bounce */
      touch-action: none;                 /* no double-tap zoom, no tap delay */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;        /* no long-press menu / magnifier */
      -webkit-tap-highlight-color: transparent;
      background: #3A1C14;
    }
    body {
      position: fixed;                    /* iOS Safari: stops page scrolling */
      inset: 0;
    }
  </style>
  <script>
    // iOS Safari ignores user-scalable=no, so block its zoom gestures directly.
    (function () {
      var stop = function (e) { e.preventDefault(); };
      var opts = { passive: false };
      document.addEventListener('gesturestart', stop, opts);   // pinch zoom
      document.addEventListener('gesturechange', stop, opts);
      document.addEventListener('gestureend', stop, opts);
      document.addEventListener('dblclick', stop, opts);       // double-tap zoom
      document.addEventListener('touchmove', stop, opts);      // page bounce / scroll
      document.addEventListener('contextmenu', stop);          // long-press menu
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
